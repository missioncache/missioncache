name: Installer smoke test

# Fresh-environment install of MissionCache, covering BOTH Linux service
# paths:
#   - smoke-systemd: plain ubuntu runner. Contrary to the task's original
#     premise, GH runners have a full systemd user session, so this
#     exercises the systemd unit path (enable --now + serving).
#   - smoke-no-systemd: ubuntu container (no systemd, like default WSL).
#     Exercises the profile-autostart fallback that once crashed on WSL -
#     the dashboard must actually START, not just install.
#
# The tree under test: wheels are built from the checkout and offered via
# PIP_FIND_LINKS/UV_FIND_LINKS, so pip/uv prefer them whenever their version
# is newer than PyPI's (the repo convention bumps versions with the change).
# When a tree version equals the published one the resolver may pick either -
# equal version means unchanged code by the release pre-flight, so both are
# the same bytes in practice.
#
# The installer itself must run from $HOME: running it from the checkout
# auto-detects maintainer mode (.claude-plugin/plugin.json marker) and would
# test editable installs instead of the user path.

on:
  pull_request:
    paths:
      - "missioncache-install/**"
      - "missioncache-db/**"
      - "missioncache-dashboard/**"
      - "missioncache-auto/**"
      - "mcp-server/**"
      - ".github/workflows/installer-smoke.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "missioncache-install/**"
      - "missioncache-db/**"
      - "missioncache-dashboard/**"
      - "missioncache-auto/**"
      - "mcp-server/**"
      - ".github/workflows/installer-smoke.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        run: pipx install uv

      - name: Build wheels from the tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local-wheels"
          for pkg in missioncache-db mcp-server missioncache-install missioncache-auto missioncache-dashboard; do
            (cd "$pkg" && uv build --quiet)
            cp "$pkg"/dist/*.whl "$GITHUB_WORKSPACE/local-wheels/"
          done
          ls -la "$GITHUB_WORKSPACE/local-wheels"

      - name: Run the installer as a user would
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/local-wheels
          UV_FIND_LINKS: ${{ github.workspace }}/local-wheels
        run: |
          cd "$HOME"
          pipx install missioncache-install
          # Exit code is the component-outcome contract: any failed component
          # (as opposed to a genuine skip, e.g. no Claude/Codex CLI here)
          # makes the installer exit 1 and fails this step.
          missioncache-install --all --yes

      - name: Assert the dashboard is actually running
        run: |
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:8787/health" > /dev/null; then
              echo "dashboard is up"
              break
            fi
            [ "$i" = "15" ] && { echo "dashboard never came up"; exit 1; }
            sleep 2
          done
          curl -s "http://localhost:8787/api/version"

      - name: Assert install shape (systemd path)
        run: |
          set -e
          test -f "$HOME/.config/systemd/user/missioncache-dashboard.service"
          systemctl --user is-active missioncache-dashboard
          command -v missioncache-dashboard
          command -v missioncache-db
          # The CLI is command-based (bare run prints the reference, exit 1);
          # grep the banner to prove the binary imports and runs.
          missioncache-db 2>&1 | grep -q "Task Database Manager"
          echo "running: $(curl -s http://localhost:8787/api/version)"
          echo "tree:    $(grep '^version' "$GITHUB_WORKSPACE/missioncache-dashboard/pyproject.toml")"

      - name: Update re-run is clean
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/local-wheels
          UV_FIND_LINKS: ${{ github.workspace }}/local-wheels
        run: |
          cd "$HOME"
          missioncache-install --update --yes

      - name: Service diagnostics on failure
        if: failure()
        run: |
          systemctl --user status missioncache-dashboard --no-pager -l || true
          journalctl --user -u missioncache-dashboard --no-pager --lines 120 || true
          # Import the server app with the venv's own python, traceback to
          # stdout - catches import-time failures no matter what happens to
          # stderr along the import chain.
          PYBIN=$(sed -n '1s/^#!//p' "$(command -v missioncache-dashboard)")
          "$PYBIN" -c "
          import traceback, sys
          try:
              import missioncache_dashboard.server
              print('server import OK')
          except BaseException:
              traceback.print_exc(file=sys.stdout)
          " || true

  smoke-no-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            python3 python3-pip pipx curl ca-certificates procps git

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Sanity - this environment really has no systemd
        run: |
          if [ -d /run/systemd/system ]; then
            echo "container unexpectedly has systemd; the fallback path is not being tested"
            exit 1
          fi

      - name: Install uv and build wheels from the tree
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install uv
          mkdir -p "$GITHUB_WORKSPACE/local-wheels"
          for pkg in missioncache-db mcp-server missioncache-install missioncache-auto missioncache-dashboard; do
            (cd "$pkg" && uv build --quiet)
            cp "$pkg"/dist/*.whl "$GITHUB_WORKSPACE/local-wheels/"
          done

      - name: Run the installer as a user would
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/local-wheels
          UV_FIND_LINKS: ${{ github.workspace }}/local-wheels
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME"
          pipx install missioncache-install
          missioncache-install --all --yes

      - name: Assert the dashboard is actually running (immediate fallback start)
        run: |
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:8787/health" > /dev/null; then
              echo "dashboard is up"
              break
            fi
            [ "$i" = "15" ] && { echo "dashboard never came up"; exit 1; }
            sleep 2
          done
          curl -s "http://localhost:8787/api/version"

      - name: Assert install shape (profile-autostart path)
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # cat-then-grep, not grep-with-two-files: GNU grep exits 2 when ANY
          # listed file is missing, even if the other one matches.
          cat "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null | grep -q "missioncache-dashboard autostart" || {
            echo "profile autostart block missing"; exit 1; }
          if [ -f "$HOME/.config/systemd/user/missioncache-dashboard.service" ]; then
            echo "orphan systemd unit written on a systemd-less session"; exit 1
          fi
          command -v missioncache-dashboard
          command -v missioncache-db
          # The CLI is command-based (bare run prints the reference, exit 1);
          # grep the banner to prove the binary imports and runs.
          missioncache-db 2>&1 | grep -q "Task Database Manager"

      - name: Update re-run is clean
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/local-wheels
          UV_FIND_LINKS: ${{ github.workspace }}/local-wheels
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME"
          missioncache-install --update --yes

      - name: Dump autostart log on failure
        if: failure()
        run: |
          cat "$HOME/.claude/logs/missioncache-dashboard-autostart.log" 2>/dev/null || echo "no autostart log"
          export PATH="$HOME/.local/bin:$PATH"
          PYBIN=$(sed -n '1s/^#!//p' "$(command -v missioncache-dashboard)")
          "$PYBIN" -c "
          import traceback, sys
          try:
              import missioncache_dashboard.server
              print('server import OK')
          except BaseException:
              traceback.print_exc(file=sys.stdout)
          " || true

  # Native Windows (no WSL). Runs the actual pytest suites so every
  # sys.platform=="win32" branch executes on real hardware (they are only
  # platform-mocked elsewhere), plus liveness/ancestry probes, an MCP-server
  # spawn, the installer, the dashboard autostart, and the two Phase C probes
  # (schtasks task body, Git Bash command-block resolution) that unit tests and
  # a POSIX runner cannot reach.
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        run: pipx install uv

      - name: Create a test venv with every package built from the tree
        run: |
          uv venv .venv
          # Install all five packages from the local tree (matching versions,
          # no PyPI resolution) plus the test + dashboard runtime deps.
          uv pip install --python .venv\Scripts\python.exe `
            ./missioncache-db ./mcp-server ./missioncache-auto `
            ./missioncache-dashboard ./missioncache-install `
            pytest pytest-asyncio httpx fastapi uvicorn duckdb

      - name: Run the full test suites on Windows
        run: |
          $env:PYTHONUTF8 = "1"
          # -p no:cacheprovider and an explicit override of the repo-root addopts
          # "-x": on the first Windows runs we want the COMPLETE failure list in
          # one go, not one failure per push.
          .venv\Scripts\python -m pytest -q -p no:cacheprovider --maxfail=50 `
            missioncache-db/tests `
            missioncache-auto/tests `
            missioncache-dashboard/tests `
            missioncache-install/tests `
            mcp-server/tests `
            hooks/tests

      - name: Liveness + ancestry probes (SYNCHRONIZE, Toolhelp32, exact-pid walk)
        run: |
          $env:PYTHONPATH = "missioncache-db"
          .venv\Scripts\python .github/scripts/windows_liveness_probe.py

      - name: stdin JSON reaches a hook through uv run
        run: |
          '{"session_id":"ci","cwd":"C:/tmp"}' | uv run --no-project --python ">=3.11" python -c "import sys,json; d=json.load(sys.stdin); assert d['session_id']=='ci'; print('stdin JSON OK')"

      - name: missioncache-db encode-cwd is native on Windows
        run: |
          $key = .venv\Scripts\missioncache-db encode-cwd
          Write-Host "encode-cwd -> $key"
          # A native Windows cwd (C:\... or D:\... on the runner) encodes to a
          # drive-letter prefix "<L>--"; the POSIX sed fallback would instead
          # yield a leading "-" from a "/c/..." MSYS path. Assert the native form.
          if ($key -notmatch '^[A-Za-z]--') { Write-Error "expected a drive-letter '<L>--' key, got $key"; exit 1 }

      - name: MCP server spawns via uvx and answers initialize
        run: |
          $env:PYTHONUTF8 = "1"
          .venv\Scripts\python .github/scripts/mcp_initialize_smoke.py

      - name: Run the installer as a user would (claude CLI absent -> graceful skip)
        env:
          UV_FIND_LINKS: ""
        run: |
          # From the repo the installer would auto-detect maintainer mode, so
          # run it from a scratch dir. Point pipx/uv at local wheels.
          uv build --wheel --out-dir "$env:GITHUB_WORKSPACE\local-wheels" ./missioncache-db
          foreach ($p in "mcp-server","missioncache-auto","missioncache-dashboard","missioncache-install") {
            uv build --wheel --out-dir "$env:GITHUB_WORKSPACE\local-wheels" ./$p
          }
          $env:PIP_FIND_LINKS = "$env:GITHUB_WORKSPACE\local-wheels"
          $env:UV_FIND_LINKS = "$env:GITHUB_WORKSPACE\local-wheels"
          pipx install missioncache-install
          Set-Location $env:USERPROFILE
          missioncache-install --all --yes

      - name: Dashboard is actually serving
        run: |
          # 127.0.0.1, not localhost: the server binds IPv4 explicitly, and on
          # Windows "localhost" resolves to ::1 first, so an IPv6-first client
          # gets connection-refused against a perfectly healthy server.
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/health" -TimeoutSec 2 | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) {
            Write-Host "--- dashboard processes ---"
            Get-Process missioncache-dashboard -ErrorAction SilentlyContinue | Format-List Id, ProcessName, StartTime
            Write-Host "--- listening sockets on 8787 ---"
            Get-NetTCPConnection -LocalPort 8787 -ErrorAction SilentlyContinue | Format-List LocalAddress, LocalPort, State
            Write-Host "--- windows dashboard log ---"
            Get-Content "$env:USERPROFILE\.claude\logs\missioncache-dashboard-windows.log" -ErrorAction SilentlyContinue
            Write-Error "dashboard never came up"; exit 1
          }
          (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/api/version").Content

      - name: schtasks task body runs (not just registers)
        run: |
          # The installer registered autostart; logon never fires on a runner,
          # so the immediate-start Popen is what served above. Prove the task
          # itself is well formed and its command executes: query it, then Run
          # it explicitly. A mangled /TR (quote stripping around a spaced exe
          # path) would pass registration and only fail here.
          $q = schtasks /Query /TN MissionCacheDashboard /V /FO LIST 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Task Scheduler task present"
            $q | Select-String "serve"
            schtasks /Run /TN MissionCacheDashboard
            Write-Host "schtasks /Run exit: $LASTEXITCODE"
          } else {
            # Non-elevated fallback: the HKCU Run key carries the same command.
            Write-Host "no schtasks task (Run-key fallback path); checking HKCU Run"
            reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v MissionCacheDashboard
            if ($LASTEXITCODE -ne 0) { Write-Error "neither schtasks task nor Run key present"; exit 1 }
          }

      - name: Slash-command PY resolution works under Git Bash
        shell: bash
        run: |
          # The commands/*.md bash blocks run under Git Bash on Windows. Prove
          # the exact resolution line yields a runnable interpreter path and
          # that a quoted "$PY" with a Windows path executes.
          PY=$(python3 -c "import sys; print(sys.executable)" 2>/dev/null || python -c "import sys; print(sys.executable)" 2>/dev/null || uv python find ">=3.11" 2>/dev/null)
          echo "PY=$PY"
          [ -n "$PY" ] || { echo "no python resolved under Git Bash"; exit 1; }
          echo '{"sessionId":"gb"}' > /tmp/ptr.json
          SID=$("$PY" -c "import json,sys; print(json.load(sys.stdin)['sessionId'])" < /tmp/ptr.json)
          [ "$SID" = "gb" ] || { echo "quoted \$PY did not execute: got '$SID'"; exit 1; }
          echo "Git Bash PY resolution OK"

      # Cross-machine import: the portability suite (missioncache-db/tests) runs
      # in the pytest step above ON Windows, so export_project/import_bundle and
      # the C:/ path translation execute natively there. A dedicated Mac-export
      # -> Windows-import artifact round-trip across jobs is a further
      # enhancement tracked in the plan, not needed to prove the code runs.

      - name: Diagnostics on failure
        if: failure()
        run: |
          Get-Content "$env:USERPROFILE\.claude\logs\missioncache-dashboard-windows.log" -ErrorAction SilentlyContinue
          Get-Content "$env:USERPROFILE\.claude\logs\statusline-errors.log" -ErrorAction SilentlyContinue
