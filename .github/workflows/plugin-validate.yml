name: Plugin validate

# Runs Claude Code's own manifest check (`claude plugin validate`) over the
# marketplace and plugin manifests, commands and hooks, so a change that the
# current Claude Code would refuse to load fails here instead of on install.
# Uses the latest Claude Code on purpose: the check is only useful against the
# rules users will meet. Warnings (e.g. CLAUDE.md at the plugin root, which is
# maintainer context) do not fail the job.

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "commands/**"
      - "hooks/**"
      - "rules/**"
      - "templates/**"
      - ".github/workflows/plugin-validate.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "commands/**"
      - "hooks/**"
      - "rules/**"
      - "templates/**"
      - ".github/workflows/plugin-validate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
